server:
  port: 8082

spring:
  application:
    name: PROPERTY-RENTAL-SERVICE
  datasource:
    url: jdbc:mysql://localhost:3307/db_property_rental?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
    username: root
    password: root123
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

redis:
  address: "redis://localhost:6379"

rabbitmq:
  exchange: "roomily.events"
  routing:
    rental-approved: "rental.approved"
    join-approved: "join.approved"
