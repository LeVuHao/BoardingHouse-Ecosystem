server:
  port: 8080

spring:
  application:
    name: API-GATEWAY
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
      routes:
        - id: auth-service
          uri: lb://AUTH-SERVICE
          predicates:
            - Path=/api/v1/auth/**, /api/v1/admin/**

        - id: property-rental-service
          uri: lb://PROPERTY-RENTAL-SERVICE
          predicates:
            - Path=/api/v1/properties/**, /api/v1/rooms/**, /api/v1/rental/**

        - id: billing-payment-service
          uri: lb://BILLING-PAYMENT-SERVICE
          predicates:
            - Path=/api/v1/bills/**, /api/v1/payments/**, /api/v1/contracts/**, /ws/**

        - id: notification-service
          uri: lb://NOTIFICATION-SERVICE
          predicates:
            - Path=/api/v1/notifications/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

